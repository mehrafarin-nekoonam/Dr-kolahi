<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>Gossypol biosynthesis in cotton</title>
<desc>Simplified pathway; some oxidative intermediates and reactions remain unresolved.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#657987"/>
          </marker>
          <style>
            text { font-family: Arial, Helvetica, sans-serif; fill: #263746; }
            .title { font-size: 34px; font-weight: 700; }
            .subtitle { font-size: 19px; fill: #657987; }
            .label { font-size: 19px; }
            .small { font-size: 15px; fill: #657987; }
            .boxlabel { font-size: 19px; font-weight: 700; }
          </style>
        </defs>
<rect width="100%" height="100%" fill="white"/>
<text class="title" x="800.0" y="58" text-anchor="middle">Gossypol biosynthesis in cotton</text>
<text class="subtitle" x="800.0" y="91" text-anchor="middle">Simplified pathway; some oxidative intermediates and reactions remain unresolved.</text>
<rect x="55" y="340" width="185" height="140" rx="12" fill="#f5f8fa" stroke="#8ba0ac" stroke-width="2"/>
<text x="147" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#263746">IPP + DMAPP</text>
<text x="147" y="435" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">C5 precursors</text>
<rect x="275" y="340" width="185" height="140" rx="12" fill="#f5f8fa" stroke="#8ba0ac" stroke-width="2"/>
<text x="367" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#263746">FPP</text>
<text x="367" y="435" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">C15 precursor</text>
<rect x="495" y="340" width="185" height="140" rx="12" fill="#f5f8fa" stroke="#8ba0ac" stroke-width="2"/>
<text x="587" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#263746">(+)-δ-cadinene</text>
<text x="587" y="435" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">sesquiterpene</text>
<rect x="715" y="340" width="185" height="140" rx="12" fill="#f5f8fa" stroke="#8ba0ac" stroke-width="2"/>
<text x="807" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#263746">Oxidative</text>
<text x="807" y="435" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">intermediates</text>
<rect x="935" y="340" width="185" height="140" rx="12" fill="#f5f8fa" stroke="#8ba0ac" stroke-width="2"/>
<text x="1027" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#263746">Hemigossypol</text>
<text x="1027" y="435" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">C15 unit</text>
<rect x="1155" y="340" width="185" height="140" rx="12" fill="#f5f8fa" stroke="#8ba0ac" stroke-width="2"/>
<text x="1247" y="400" text-anchor="middle" font-size="19" font-weight="bold" fill="#263746">Gossypol</text>
<text x="1247" y="435" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">C30H30O8</text>
<line x1="244" y1="410" x2="268" y2="410" stroke="#657987" stroke-width="3" marker-end="url(#arrow)"/>
<text x="257.5" y="515" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">FPP synthase</text>
<line x1="464" y1="410" x2="488" y2="410" stroke="#657987" stroke-width="3" marker-end="url(#arrow)"/>
<text x="477.5" y="515" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">CDNC</text>
<line x1="684" y1="410" x2="708" y2="410" stroke="#657987" stroke-width="3" marker-end="url(#arrow)"/>
<text x="697.5" y="515" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">CYP706B1; DH1</text>
<line x1="904" y1="410" x2="928" y2="410" stroke="#657987" stroke-width="3" marker-end="url(#arrow)"/>
<text x="917.5" y="515" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">CYP82D113; CYP71BE79</text>
<line x1="1124" y1="410" x2="1148" y2="410" stroke="#657987" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1137.5" y="515" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">Dimerization</text>
<rect x="22" y="160" width="250" height="90" rx="12" fill="#eef4f7" stroke="#9eb2bc" stroke-width="2"/>
<text x="147" y="195" text-anchor="middle" font-size="17" font-weight="normal" fill="#263746">MEP pathway (plastid)</text>
<text x="147" y="222" text-anchor="middle" font-size="17" font-weight="normal" fill="#263746">MVA pathway (cytosol)</text>
<line x1="147" y1="250" x2="147" y2="330" stroke="#657987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="800" y="610" text-anchor="middle" font-size="17" font-weight="normal" fill="#263746">CYP706B1 = (+)-δ-cadinene 7-hydroxylase; oxidative intermediates are simplified.</text>
<rect x="430" y="670" width="740" height="78" rx="12" fill="#fff8ef" stroke="#d9b68c" stroke-width="2"/>
<text x="800" y="718" text-anchor="middle" font-size="17" font-weight="normal" fill="#263746">The detailed pathway includes unresolved intermediates and reactions.</text>
<text x="800" y="810" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a4f36">FPP—not GGPP—is the substrate used by (+)-δ-cadinene synthase.</text>
<a href="https://doi.org/10.1073/pnas.1805085115" target="_blank" rel="noopener noreferrer">
<text x="800" y="925" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">Source: Tian et al., PNAS 115 (2018), doi:10.1073/pnas.1805085115.</text>
</a>
</svg>