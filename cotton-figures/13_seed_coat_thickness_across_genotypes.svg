<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img">
<title>Seed-coat thickness reported across cotton genotypes</title>
<desc>Study-specific observed range; cultivar-level measurements are not shown.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#657987"/>
          </marker>
          <style>
            text { font-family: Arial, Helvetica, sans-serif; fill: #263746; }
            .title { font-size: 34px; font-weight: 700; }
            .subtitle { font-size: 19px; fill: #657987; }
            .label { font-size: 19px; }
            .small { font-size: 15px; fill: #657987; }
            .boxlabel { font-size: 19px; font-weight: 700; }
          </style>
        </defs>
<rect width="100%" height="100%" fill="white"/>
<text class="title" x="800.0" y="58" text-anchor="middle">Seed-coat thickness reported across cotton genotypes</text>
<text class="subtitle" x="800.0" y="91" text-anchor="middle">Study-specific observed range; cultivar-level measurements are not shown.</text>
<text x="800" y="280" text-anchor="middle" font-size="40" font-weight="bold" fill="#d98948">0.41–1.00 mm</text>
<line x1="210" y1="420" x2="1390" y2="420" stroke="#d5dde0" stroke-width="10"/>
<line x1="693.8" y1="420" x2="1390.0" y2="420" stroke="#d98948" stroke-width="26"/>
<circle cx="693.8" cy="420" r="15" fill="#d98948" stroke="white" stroke-width="4"/>
<text x="693.8" y="475" text-anchor="middle" font-size="20" font-weight="bold" fill="#263746">0.41 mm</text>
<circle cx="1390.0" cy="420" r="15" fill="#d98948" stroke="white" stroke-width="4"/>
<text x="1390.0" y="475" text-anchor="middle" font-size="20" font-weight="bold" fill="#263746">1.00 mm</text>
<text x="210" y="525" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">0 mm</text>
<text x="1390" y="525" text-anchor="middle" font-size="16" font-weight="normal" fill="#657987">1.0 mm</text>
<text x="800" y="585" text-anchor="middle" font-size="20" font-weight="normal" fill="#263746">Observed among 200 cotton genotypes in one 2018 field study.</text>
<text x="800" y="625" text-anchor="middle" font-size="18" font-weight="normal" fill="#657987">This range is study-specific—not a universal biological limit.</text>
<a href="https://doi.org/10.5281/zenodo.10619689" target="_blank" rel="noopener noreferrer">
<text x="800" y="790" text-anchor="middle" font-size="13" font-weight="normal" fill="#657987">Killi, Beycioglu &amp; Dogan, J. Sci. Eng. Res. 8(12):47–54 (2021), doi:10.5281/zenodo.10619689.</text>
</a>
</svg>