<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img">
<title>Reported variation in cotton seed traits</title>
<desc>Observed min–max ranges across 200 cotton genotypes in one field study.</desc>
